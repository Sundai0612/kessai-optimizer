name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 書き方のチェック
        run: npm run lint
      - name: テスト
        run: npm test
      - name: 組み立てできるかの確認（型のチェックを含む）
        run: npm run build
